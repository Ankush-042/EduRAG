# Light mode only — non-negotiable per UI/UX spec Doc 3 sec 2.1 / 26.
#
# Colors retuned a third time for the final visual pass (see app/ui/main.py's
# module docstring): warm cream surfaces + accent blue, matching that file's
# injected <style> block CSS variables (--edu-bg, --edu-bg-panel, --edu-accent,
# --edu-ink) -- a synthesis of the first pass's warm palette and the second
# pass's cleaner accent color, per the reference mockup he supplied. This
# file is just the safe global baseline Streamlit itself uses for its own
# native widgets that the injected CSS doesn't otherwise override, so
# anything not explicitly restyled still matches instead of clashing with it.
[theme]
base = "light"
primaryColor = "#2F6FED"
backgroundColor = "#FBF7EF"
secondaryBackgroundColor = "#F5EFE1"
textColor = "#22252B"
font = "sans-serif"
showSidebarBorder = false

[browser]
gatherUsageStats = false
